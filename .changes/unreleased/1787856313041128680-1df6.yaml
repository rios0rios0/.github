kind: 'Changed'
body: 'changed the Claude Code workflows to callers: the reusable `workflow_call` definitions moved to [`rios0rios0/pipelines`](https://github.com/rios0rios0/pipelines) as `reusable-claude-review.yaml` and `reusable-claude-mention.yaml`. The `reusable-` prefix marks a definition, so the callers here drop it: `.github/workflows/claude-review.yaml`, `.github/workflows/claude-mention.yaml` and both `workflow-templates/` starter templates (with their paired `.properties.json`) now carry the same names a consuming repository uses, and pass `CLAUDE_CODE_OAUTH_TOKEN` explicitly instead of `secrets: inherit`, which fails Semgrep''s `yaml.github-actions.security.secrets-inherit` rule. The starter templates are now byte-identical to the callers this account actually runs, so adopting one from the **Actions > New workflow** picker yields the same file every other repository has, job-level permissions included.'
time: '2026-08-27T18:45:13.041008791Z'
